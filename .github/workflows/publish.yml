name: Publish to npm

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      # The scan n8n runs on a published package lints the whole repo, not just the
      # source directories `npm run lint` targets. A violation only this scope catches
      # is what failed the 0.5.1 submission review.
      - name: Lint whole repo
        run: npx eslint .

      # Mirrors the stricter ruleset `prepublishOnly` applies, which this workflow
      # bypasses by publishing from CI rather than from a local `npm publish`.
      - name: Lint with prepublish rules
        run: npx eslint -c .eslintrc.prepublish.js nodes credentials package.json

      - name: Test
        run: npm test

      - name: Verify tag matches package version
        run: |
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          test "$GITHUB_REF_NAME" = "v$PACKAGE_VERSION"

      - name: Publish
        run: npm publish --access public --provenance
